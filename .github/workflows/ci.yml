name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install slixmpp aiohttp python-dotenv pytest pytest-asyncio ruff

      - name: Check formatting & import sorting (Ruff)
        run: ruff check --select E,F,I --ignore E501 .

      - name: Run unit tests (Pytest)
        run: python -m pytest -v

  shellcheck:
    name: Lint Proxmox Scripts (ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on ct/ and install/ scripts
        run: |
          shellcheck -x -e SC1090,SC1091,SC2034,SC2154 ct/*.sh install/*.sh
